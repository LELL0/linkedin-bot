[project]
name = "linkedin-reply-bot"
version = "0.1.0"
description = "Reply-only LinkedIn automation: accepts incoming connection requests and answers direct messages."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
