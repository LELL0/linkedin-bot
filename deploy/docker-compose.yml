# LinkedIn reply bot on a server. Settings go in .env next to this file (AI_API_KEY, and
# ENC_BOT_SECRET and ENC_OWNER (the owner's Enc user id) for the Enc Chat bot bot_linkedin; ENC_BOT_URL defaults to
# http://enc-bot-agent:8787; until the trial ends TG_BOT_TOKEN plus TG_CHAT_ID for the Telegram
# mirror). Data (Chrome profile with the LinkedIn login, state, logs, timings) lives in ./data.
name: linkedin-bot

services:
  linkedin-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
    image: linkedin-bot:local
    restart: unless-stopped
    env_file: .env
    networks: [default, enc-bots]  # enc-bots: where the bot agent (enc-bot-agent:8787) runs
    environment:
      TZ: ${TZ:-Asia/Riyadh}
    volumes:
      - ./data:/data
    ports:
      # VNC, for signing in to LinkedIn: loopback only, use an SSH tunnel.
      - "127.0.0.1:5901:5900"
    # Chromium's sandbox needs user namespaces, which Docker's default seccomp profile
    # blocks. chromium-seccomp.json is Docker's default (moby v28.3.3) plus chroot, clone,
    # clone3, unshare and setns, so the sandbox works while every other filter stays on.
    security_opt:
      - seccomp=./chromium-seccomp.json
      - no-new-privileges:true
    cap_drop: [ALL]
    shm_size: 512m
    mem_limit: 1536m
    cpus: ${LINKEDIN_BOT_CPUS:-0.5}

networks:
  enc-bots:
    external: true
